name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/build-43-playback
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
      - "tests/**"

# Only the newest revision of each branch should consume a macOS runner.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test playback queue
        run: |
          cat ios/UnSound/Services/PlaybackQueue.swift ios/UnSound/Services/PlaybackSession.swift ios/UnSound/Services/AudioLevelPolicy.swift tests/PlaybackQueueTests.swift > "$RUNNER_TEMP/queue-tests.swift"
          swift "$RUNNER_TEMP/queue-tests.swift"

      - name: Test imports and audio processing
        run: |
          cat ios/UnSound/Services/FileFingerprint.swift ios/UnSound/Services/AudioLevelPolicy.swift ios/UnSound/Services/AudioLevelAnalyzer.swift ios/UnSound/Services/AudioOutputProtection.swift tests/AudioImportTests.swift > "$RUNNER_TEMP/audio-tests.swift"
          swift "$RUNNER_TEMP/audio-tests.swift"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project UnSound.xcodeproj \
            -scheme UnSound \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify release configuration
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/UnSound.app"
          SOURCE_PLIST="UnSound/Resources/Info.plist"

          test -d "$APP"
          test -f "$APP/Info.plist"

          echo "Launch screen resources:"
          find "$APP" -name 'LaunchScreen.storyboardc' -type d -print
          find "$APP" -name 'LaunchScreen.storyboardc' -type d -print -quit | grep -q .

          SOURCE_LAUNCH=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$SOURCE_PLIST")
          SOURCE_FULLSCREEN=$(/usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$SOURCE_PLIST" | tr '[:upper:]' '[:lower:]')
          SOURCE_BACKGROUND=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$SOURCE_PLIST")

          echo "source UILaunchStoryboardName=$SOURCE_LAUNCH"
          echo "source UIRequiresFullScreen=$SOURCE_FULLSCREEN"
          echo "source UIBackgroundModes[0]=$SOURCE_BACKGROUND"

          test "$SOURCE_LAUNCH" = "LaunchScreen"
          test "$SOURCE_FULLSCREEN" = "true"
          test "$SOURCE_BACKGROUND" = "audio"

      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf Payload UnSound.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UnSound.app Payload/
          /usr/bin/zip -qry UnSound.ipa Payload
          test -s UnSound.ipa
          /usr/bin/unzip -l UnSound.ipa | grep -q 'Payload/UnSound.app/UnSound'

      - uses: actions/upload-artifact@v4
        with:
          name: UnSound-iOS-unsigned
          path: ios/UnSound.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Keep only the three newest successful IPA artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "UnSound-iOS-unsigned" and .expired == false) | [.created_at, (.id | tostring)] | @tsv' > "$RUNNER_TEMP/ipa-artifacts.tsv"
          sort -r "$RUNNER_TEMP/ipa-artifacts.tsv" | tail -n +4 | cut -f2 | while read -r artifact_id; do
            test -n "$artifact_id" || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
